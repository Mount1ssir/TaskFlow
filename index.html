<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div>
          <h1>TaskFlow</h1>
          <p>Organize your day, one task at a time.</p>
        </div>
        <span class="date" id="currentDate"></span>
      </header>

      <section class="stats">
        <article class="stat-card">
          <span>Total tasks</span>
          <strong id="totalTasks">0</strong>
        </article>

        <article class="stat-card">
          <span>Completed</span>
          <strong id="completedTasks">0</strong>
        </article>

        <article class="stat-card">
          <span>Remaining</span>
          <strong id="remainingTasks">0</strong>
        </article>
      </section>

      <section class="form-section">
        <h2>Add a task</h2>

        <form id="taskForm">
          <input
            type="text"
            id="taskInput"
            placeholder="What do you need to do?"
          />

          <select id="priorityInput">
            <option value="low">Low priority</option>
            <option value="medium">Medium priority</option>
            <option value="high">High priority</option>
          </select>

          <button type="submit">Add task</button>
        </form>

        <p id="errorMessage" class="error"></p>
      </section>

      <section class="tasks-section">
        <div class="toolbar">
          <h2>My tasks</h2>

          <input type="search" id="searchInput" placeholder="Search tasks..." />
        </div>

        <nav class="filters" aria-label="Task filters">
          <button class="filter" data-filter="all">All</button>
          <button class="filter active" data-filter="active">Active</button>
          <button class="filter" data-filter="completed">Completed</button>
        </nav>

        <ul id="taskList" class="task-list"></ul>

        <p id="emptyMessage" class="empty-message">
          No tasks yet. Add your first task!
        </p>
      </section>
    </main>
  </body>
  <script src="js/script.js"></script>
</html>
