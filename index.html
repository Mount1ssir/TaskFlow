<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div>
          <h1>TaskFlow</h1>
          <p>Manage your productivity.</p>
        </div>
      </header>

      <section class="stats">
        <article class="stat-card">
          <h3>Total Tasks</h3>
          <p id="totalTasks">0</p>
        </article>

        <article class="stat-card">
          <h3>Completed</h3>
          <p id="completedTasks">0</p>
        </article>

        <article class="stat-card">
          <h3>Pending</h3>
          <p id="pendingTasks">0</p>
        </article>
      </section>

      <section class="tasks-section">
        <h2>My Tasks</h2>

        <div class="task-list" id="taskList">
          <!-- Tasks will be managed later -->
        </div>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
